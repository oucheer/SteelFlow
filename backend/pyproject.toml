dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.14", "pydantic-settings>=2.7", "PyJWT>=2.10", "pwdlib[argon2]>=0.2", "reportlab>=4.3", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
